# HTTP MCP Server Configuration
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}
# CORS is off by default: MCP clients are not browsers and do not need it. Set
# MCP_CORS_ENABLED=true only together with an explicit MCP_CORS_ORIGINS list, because Quarkus
# allows every origin when cors.origins is left unset.
quarkus.http.cors.enabled=${MCP_CORS_ENABLED:false}
quarkus.http.cors.origins=${MCP_CORS_ORIGINS:}
quarkus.mcp.server.http.root-path=/mcp

# Logging configuration
quarkus.log.level=INFO

# Lichess API configuration
lichess.api.token=
